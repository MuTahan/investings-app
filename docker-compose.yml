# Full-stack: Postgres + Redis + FastAPI backend + React PWA (nginx).
# Run everything with:  docker compose up --build
# Then open http://localhost:8080
#
# Runs out-of-the-box with no API keys (AI in deterministic mode, no live quotes).
# To enable live data / AI / notifications, add the relevant vars to the `api`
# environment block below (see backend/.env.example for the full list).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: investing
      POSTGRES_DB: investing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # All keys are loaded straight from the gitignored `.env` (copy .env.example -> .env).
    # Using env_file (not ${VAR} interpolation) means a stray shell variable can never
    # shadow your .env values. DATABASE_URL/REDIS_URL below override for the compose net.
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://investing:investing@db:5432/investing
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
